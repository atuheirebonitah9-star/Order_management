<!-- orders/templates/orders/confirm_delete.html -->
{% extends 'orders/base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-lg-6">
        <div class="card border-danger shadow-sm">
            <div class="card-header bg-danger text-white pt-3 pb-3">
                <h4 class="mb-0">
                    <i class="bi bi-exclamation-triangle me-2"></i>Confirm Deletion
                </h4>
            </div>
            <div class="card-body p-4 text-center">
                <p class="fs-5 mb-3">
                    Are you sure you want to delete this <strong>{{ type }}</strong>?
                </p>
                
                <div class="alert alert-secondary fw-bold fs-5 mb-4">
                    {{ object }}
                </div>

                <div class="alert alert-warning small text-start">
                    <i class="bi bi-info-circle me-1"></i>
                    This action cannot be undone. Any related records (like items on an order) will also be permanently removed.
                </div>

                <form method="post" class="mt-4">
                    {% csrf_token %}
                    <a href="javascript:history.back()" class="btn btn-light border px-4 me-2">
                        Cancel
                    </a>
                    <button type="submit" class="btn btn-danger px-4">
                        <i class="bi bi-trash me-1"></i> Yes, Delete
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
