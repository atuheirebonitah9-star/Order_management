<!-- orders/templates/orders/restaurant_list.html -->
{% extends 'orders/base.html' %}

{% block content %}
<h1 class="mb-4">Restaurants</h1>

<form method="get" class="mb-4">
    <div class="input-group">
        <input type="text" name="search" class="form-control"
               placeholder="Search restaurants"
               value="{{ search_query|default:'' }}">
        <button type="submit" class="btn btn-primary">Search</button>
    </div>
</form>

<div class="row">
    {% for restaurant in restaurants %}
    <div class="col-md-4 mb-3">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">{{ restaurant.name }}</h5>
                <p class="card-text">
                    <strong>Address:</strong> {{ restaurant.address }}<br>
                    <strong>Status:</strong>
                    <span class="badge bg-{% if restaurant.is_open %}success{% else %}danger{% endif %}">
                        {% if restaurant.is_open %}Open{% else %}Closed{% endif %}
                    </span>
                </p>
            </div>
        </div>
    </div>
    {% empty %}
    <div class="col-12">
        <div class="alert alert-info">No restaurants found</div>
    </div>
    {% endfor %}
</div>
{% endblock %}
